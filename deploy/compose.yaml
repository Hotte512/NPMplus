# NPMplus · Hotte – Referenz-Compose
#
# Ablage z. B. unter /opt/npmplus-hotte/compose.yaml, Start mit:
#   docker compose -f /opt/npmplus-hotte/compose.yaml up -d
# Der Installer (install/install.sh) erzeugt genau diese Datei, passend zu den gewählten Optionen. Übernimmt er eine
# vorhandene Installation (z. B. community-scripts), kommen deren Variablen, Bind-Mounts, dns und cap_add hinzu.
#
# Daten:  /opt/npmplus (NPMplus), /opt/unifi-api-guard (Guard), /opt/crowdsec (CrowdSec)
# Ports:  80/443 (Proxy), 81 (NPMplus-Oberfläche, HTTPS), 8091 (Guard-Admin), 8090 nur lokal (Guard-Proxy),
#         127.0.0.1:8080/7422 (CrowdSec LAPI/AppSec)
#
# Optionale Blöcke stehen zwischen „# >>> optional …“ und „# <<< optional …“: zum Aktivieren in diesen Zeilen
# das erste „#“ entfernen.
# Alle Optionen von NPMplus: https://github.com/ZoeyVid/NPMplus/blob/develop/compose.yaml
name: npmplus
services:
  npmplus:
    container_name: npmplus
    restart: unless-stopped
    image: ghcr.io/hotte512/npmplus:hotte-main
    pull_policy: always
    network_mode: host # Pflicht für CrowdSec und den Guard auf 127.0.0.1
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - "/opt/npmplus:/data"
    environment:
      - "TZ=Europe/Berlin" # Pflicht, Zeitzone aus https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
# >>> optional: acme-email
#      - "ACME_EMAIL=admin@example.com" # optional bei Let's Encrypt, Pflicht bei ZeroSSL/Google
# <<< optional: acme-email
# >>> optional: crowdsec-logs
#      - "LOGROTATE=true" # schreibt access.log nach /opt/npmplus/nginx/logs, nötig für CrowdSec
# <<< optional: crowdsec-logs

