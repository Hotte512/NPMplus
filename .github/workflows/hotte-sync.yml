name: Hotte Sync Build
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "build even if nothing changed"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner != 'ZoeyVid' }}
    permissions:
      contents: read
      packages: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
      - name: load config
        run: grep -E '^[A-Z_]+=' ci/hotte-sync.env >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FEATURES_BRANCH }}
          path: src
          fetch-depth: 0
      - name: ghcr.io-login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: assemble
        id: assemble
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM"
          release="$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)"
          git fetch -q --no-tags upstream develop "+refs/tags/$release:refs/tags/$release"
          mapfile -t commits < <(git rev-list --reverse "$FEATURES_BASE..HEAD")
          echo "replaying ${#commits[@]} commits from $FEATURES_BRANCH"

          replay() {
            git checkout -q --detach "$1"
            for c in "${commits[@]}"; do
              git cherry-pick "$c" > /dev/null 2>&1 && continue
              # already contained in the base: nothing staged and no conflicts
              if [ -z "$(git diff --name-only --diff-filter=U)" ] && git diff --cached --quiet; then
                git cherry-pick --skip
                continue
              fi
              echo "::warning::$(git log -1 --format='%h %s' "$c") does not apply on $2"
              git cherry-pick --abort
              return 1
            done
          }

          if replay "refs/tags/$release" "release $release"; then
            label="$release"
          elif replay upstream/develop develop; then
            label="develop-$(git rev-parse --short upstream/develop)"
          else
            title="Hotte sync: features do not apply on $release or develop"
            if [ "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"Hotte sync\" in:title" --json number -q length)" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body "The nightly build could not replay \`$FEATURES_BRANCH\` onto \`$release\` or \`develop\` of $UPSTREAM. The last image stays in place. Rebase \`$FEATURES_BRANCH\` and update FEATURES_BASE in hotte-sync.env. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                || echo "::warning::could not open an issue (issues disabled?)"
            fi
            exit 1
          fi

          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/npmplus"
          tree="$(git rev-parse --short=12 'HEAD^{tree}')"
          skip=false
          if [ "$FORCE" != "true" ] && docker manifest inspect "$image:hotte-$tree" > /dev/null 2>&1; then
            skip=true
          fi

          version="$label-$(git rev-parse --short HEAD)-hotte"
          jq --arg v "$version" '.version = $v' frontend/package.json > frontend/package.json.tmp && mv frontend/package.json.tmp frontend/package.json
          jq --arg v "$version" '.version = $v' backend/package.json > backend/package.json.tmp && mv backend/package.json.tmp backend/package.json

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "tags=$image:hotte-main,$image:hotte-$tree" >> "$GITHUB_OUTPUT"
          {
            echo "base: \`$label\`"
            echo "version: \`$version\`"
            echo "image: \`$image:hotte-main\` (\`hotte-$tree\`)"
            if [ "$skip" = "true" ]; then echo "nothing changed, build skipped"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ steps.assemble.outputs.skip != 'true' }}
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ steps.assemble.outputs.skip != 'true' }}
        with:
          context: src
          push: true
          tags: ${{ steps.assemble.outputs.tags }}
          build-args: |
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full
